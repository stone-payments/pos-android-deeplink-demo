apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply from: rootProject.file("signatures/positivo/positivo-signing-config.gradle")
apply from: rootProject.file("signatures/gertec/gertec-signing-config.gradle")
apply from: rootProject.file("signatures/stone/stone-signing-config.gradle")

android {
    compileSdk 35
    defaultConfig {
        applicationId "br.com.stone.posandroid.posdeeplink"
        minSdkVersion 22
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'br.com.stone.posandroid.posdeeplink'

    kotlinOptions {
        jvmTarget = '17'
    }

    flavorDimensions = ["model"]

    productFlavors {

        sunmiLegacy { //Flavor para Sunmi P2A7, usando HAL 1.x
            dimension "model"
            signingConfig signingConfigs.stone
            versionNameSuffix "-sunmiLegacy"

        }

        sunmiSeriesP { //Flavor os novos terminais Sunmi (P2A11), usando HAL 2.x
            dimension "model"
            signingConfig signingConfigs.stone
            versionNameSuffix "-sunmiSeriesP"
        }

        ingenico {
            dimension "model"
            signingConfig signingConfigs.stone
            versionNameSuffix "-ingenico"
        }

        tectoySeriesT {
            dimension "model"
            signingConfig signingConfigs.stone
            versionNameSuffix "-tectoySeriesT"
        }

    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
